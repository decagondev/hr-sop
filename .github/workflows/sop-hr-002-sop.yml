# Auto-generated by sop-forge from SOP-HR-002. Regenerate; don't hand-edit.
name: SOP · Hire for an open role: requisition to signed contract

on:
  pull_request:
    paths:
      - "automation/python/**"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (safe) or execute (runs the SOP for real)"
        type: choice
        options: [dry-run, execute]
        default: dry-run
      confirm_destructive:
        description: "Type YES to allow destructive steps when mode=execute"
        type: string
        default: "no"

permissions:
  contents: read

jobs:
  run-sop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PRs and the default dispatch: never touch anything, just preflight.
      - name: Dry-run (Hire for an open role: requisition to signed contract)
        if: >-
          github.event_name == 'pull_request' ||
          github.event.inputs.mode == 'dry-run'
        working-directory: automation/python
        run: python -m sop_runner --dry-run

      # Manual execute path. Destructive steps still require the typed confirm.
      - name: Execute (Hire for an open role: requisition to signed contract)
        if: >-
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.mode == 'execute'
        working-directory: automation/python
        run: |
          if [ "${{ github.event.inputs.confirm_destructive }}" = "YES" ]; then
            echo "Destructive steps ENABLED by operator confirmation."
            python -m sop_runner --yes
          else
            echo "Destructive steps NOT confirmed; running non-destructive only."
            python -m sop_runner
          fi
